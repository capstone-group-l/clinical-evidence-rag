default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key

  # Python (backend, scripts, eval) — version matches backend/requirements-dev.txt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Frontend — uses the eslint/prettier versions pinned in frontend/package.json
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        language: system
        entry: bash -c 'cd frontend && npx --no-install prettier --write --ignore-unknown "${@#frontend/}"' --
        files: ^frontend/
        exclude: ^frontend/package-lock\.json$
        types_or: [javascript, jsx, ts, tsx, css, json, html, markdown, yaml]
      - id: eslint
        name: eslint
        language: system
        entry: bash -c 'cd frontend && npx --no-install eslint --fix --max-warnings=0 "${@#frontend/}"' --
        files: ^frontend/.*\.(js|jsx)$
