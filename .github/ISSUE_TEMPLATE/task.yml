name: Task
description: A unit of work (feature, setup, refactor)
title: "[Task]: "
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Backend (FastAPI / RAG pipeline)
        - Frontend (React)
        - Corpus / ingestion
        - Evaluation tooling / harness
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: hours
    attributes:
      label: Estimated effort (hours)
      description: Number only, e.g. 3.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / dependencies
      description: Related issues, links, or blockers.
