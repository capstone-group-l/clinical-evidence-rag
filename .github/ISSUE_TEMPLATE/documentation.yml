name: Documentation
description: Create or edit non-code project material (reports, README, presentations, images, templates)
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: doc-type
    attributes:
      label: Document type
      options:
        - Reports
        - README
        - Presentation / slides
        - Image / diagram / figure
        - Template
        - Other documentation (guides, API docs, architecture notes)
        - Other
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: Action
      options:
        - Create new
        - Edit / update existing
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Document location
      description: File path in the repo, or a link to the document (Google Docs, Slides, Drive, etc.). For new documents, the intended path or folder.
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be created or changed, and why?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How do we know it's done?
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: input
    id: hours
    attributes:
      label: Estimated effort (hours)
      description: Number only, e.g. 3.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes / dependencies
      description: Related issues, reference material, or blockers.
