name: Bug report
description: Something is broken or behaving incorrectly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Query expansion (UMLS)
        - Retrieval (BM25 / pgvector)
        - Reranking
        - Generation (LLM)
        - Citation-ID validation
        - Claim-passage alignment (NLI)
        - API / auth
        - Frontend
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the query, the actual output, and the expected output.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce bug
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Local, Render, or Vercel; branch or commit hash.
